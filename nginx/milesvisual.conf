# REDIRECCIÓN AUTOMÁTICA A HTTPS
server {
    listen 80;
    server_name milesvisual.duckdns.org;
    return 301 https://$host$request_uri;
}

# CONFIGURACIÓN PRINCIPAL (HTTPS)
server {
    listen 443 ssl; # managed by Certbot
    server_name milesvisual.duckdns.org;
    client_max_body_size 500M;

    # CERTIFICADOS SSL (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/milesvisual.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/milesvisual.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Compresión Gzip Mejorada
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types 
        text/plain 
        text/css 
        text/xml 
        application/json 
        application/javascript 
        application/x-javascript 
        application/xml 
        application/xml+rss 
        text/javascript 
        image/svg+xml 
        font/woff 
        font/woff2;

    # Cabeceras de Seguridad
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    # 1. Caché para archivos estáticos de Next.js (_next/static)
    location /_next/static/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 2. Caché para archivos públicos (imágenes, iconos, fuentes en /public)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|otf|webp|mp4|webm)$ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, must-revalidate";
    }

    # 3. Rutas específicas del BACKEND (NestJS Auth)
    location ~ ^/api/auth/(login|logout|check-session) {
        proxy_pass http://localhost:3002/auth/$1;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 4. El resto de /api/auth/ va al FRONTEND (NextAuth)
    location /api/auth/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # 5. El resto de la API va al BACKEND
    location /api/ {
        proxy_pass http://localhost:3002/; 
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # 6. Frontend Next.js
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }
}
