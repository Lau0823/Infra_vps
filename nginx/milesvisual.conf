# REDIRECCIÓN AUTOMÁTICA A HTTPS
server {
    listen 80;
    server_name milesvisual.duckdns.org;
    return 301 https://$host$request_uri;
}

# CONFIGURACIÓN PRINCIPAL (HTTPS)
server {
    listen 443 ssl; # managed by Certbot
    server_name milesvisual.duckdns.org;
    client_max_body_size 500M;

    # CERTIFICADOS SSL (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/milesvisual.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/milesvisual.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Compresión Gzip (Nivel 4 para ser más rápido y menos pesado para el CPU)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Optimización de Buffers (Evita que Nginx use el disco para guardar respuestas temporales de Next.js)
    proxy_buffers 16 16k;
    proxy_buffer_size 32k;

    # 1. Estáticos de Next.js
    location /_next/static/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
    }

    # 2. Archivos Públicos
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|otf|webp)$ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        access_log off;
    }

    # 3. API y Auth
    location /api/ {
        proxy_pass http://localhost:3002/; 
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # 4. Frontend Next.js (Sin cabeceras restrictivas)
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
