name: Deploy Infra

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /var/www/infra
            git pull origin main
            docker compose up -d
            sudo cp nginx/milesvisual.conf /etc/nginx/sites-available/milesvisual
            sudo ln -sf /etc/nginx/sites-available/milesvisual /etc/nginx/sites-enabled/
            sudo nginx -t && sudo systemctl restart nginx
